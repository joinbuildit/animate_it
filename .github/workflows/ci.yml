name: CI

on:
  push:
  pull_request:
  workflow_call: # so release.yml can gate on a green run

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Rubocop
        run: bundle exec rubocop

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
        gemfile: [rails_7.2, rails_8.1]
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}.gemfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }} (${{ matrix.gemfile }})
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Fast specs — unit + request — on every Rails × Ruby cell. No browser or
      # ffmpeg, so these stay quick across the whole matrix.
      - name: RSpec (unit + request)
        run: bundle exec rspec --exclude-pattern "spec/rendering_spec.rb"

      # The end-to-end render smoke drives real Chromium + FFmpeg, so run it once
      # on the newest supported cell rather than on all four.
      - name: Set up Node
        if: matrix.ruby == '3.4' && matrix.gemfile == 'rails_8.1'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        if: matrix.ruby == '3.4' && matrix.gemfile == 'rails_8.1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright + Chromium
        if: matrix.ruby == '3.4' && matrix.gemfile == 'rails_8.1'
        run: |
          npm install -g playwright@1.61
          playwright install --with-deps chromium

      - name: RSpec (render smoke)
        if: matrix.ruby == '3.4' && matrix.gemfile == 'rails_8.1'
        env:
          CI: "true"
          RUN_RENDER_SMOKE: "1"
          PLAYWRIGHT_CLI_EXECUTABLE_PATH: playwright
        run: bundle exec rspec spec/rendering_spec.rb
